name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must match pyproject.toml, e.g. 0.8.0)"
        required: true
      draft:
        description: "Create a draft GitHub release"
        required: false
        default: false
        type: boolean

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Check version matches pyproject.toml
        run: |
          pyproject_version=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$pyproject_version" != "${{ inputs.version }}" ]; then
            echo "::error::Version ${{ inputs.version }} does not match pyproject.toml ($pyproject_version)"
            exit 1
          fi

      - name: Create GitHub release and tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          generate_release_notes: true
          draft: ${{ inputs.draft }}
